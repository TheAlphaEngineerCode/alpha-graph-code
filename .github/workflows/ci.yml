name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Um push novo cancela a execução anterior do mesmo branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 é o mínimo real: pnpm 11 declara engines.node >=22.13, então
        # anunciar Node 20 seria uma promessa que o próprio gerenciador quebra.
        node: ["22", "24"]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Formatação
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      # Com cobertura, não sem: o limite de 85% do critério de aceite 06 está em
      # `vitest.config.ts`, e limite que o CI não executa não é limite.
      - name: Testes e cobertura
        run: pnpm run coverage

      - name: Build
        run: pnpm run build

  # Invariante 3 verificado fora do lint também. Uma regra de ESLint se desliga com
  # `// eslint-disable`; este grep não. É de propósito que ele seja burro e independente.
  no-dynamic-eval:
    name: Nenhuma avaliação dinâmica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Varrer packages e apps
        run: |
          set -uo pipefail

          # `apps/` só existe a partir da v0.2, então a lista é montada, não fixa.
          dirs=""
          for d in packages apps; do
            [ -d "$d" ] && dirs="$dirs $d"
          done
          if [ -z "$dirs" ]; then
            echo "::error::Nada para varrer. O layout do repositório mudou e este check parou de olhar."
            exit 1
          fi

          # Uma varredura que não olhou arquivo nenhum passaria em silêncio e
          # pareceria idêntica a uma varredura limpa. Contar é o que separa as duas.
          count=$(find $dirs \( -name '*.ts' -o -name '*.tsx' -o -name '*.mts' \) \
                    -not -path '*/node_modules/*' -not -path '*/dist/*' | wc -l)
          echo "Varrendo $count arquivos em$dirs"
          if [ "$count" -eq 0 ]; then
            echo "::error::A varredura não encontrou arquivo algum. Check que não pode falhar não é check."
            exit 1
          fi

          patterns='\beval[[:space:]]*\(|\bnew[[:space:]]+Function[[:space:]]*\(|from[[:space:]]+.(node:)?vm.'
          if grep -rInE "$patterns" \
               --include='*.ts' --include='*.tsx' --include='*.mts' \
               --exclude-dir=node_modules --exclude-dir=dist \
               $dirs; then
            echo "::error::Invariante 3 violado: avaliação dinâmica encontrada. Use packages/expr (AGX-Expr)."
            exit 1
          fi
          echo "Nenhuma avaliação dinâmica encontrada."

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verificar Signed-off-by em cada commit do PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list "$BASE".."$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::Commit $sha sem Signed-off-by. Use 'git commit -s'."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Ver CONTRIBUTING.md e docs/decisions/ADR-0001-licenca-apache-2.0-e-dco.md"
            exit 1
          fi
          echo "Todos os commits têm sign-off."
