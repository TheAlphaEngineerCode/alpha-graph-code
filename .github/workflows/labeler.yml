name: Pull request labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label changed areas
    runs-on: ubuntu-latest
    steps:
      # No contributor code is checked out or executed under this privileged
      # event. The official action reads configuration from the base branch.
      - uses: actions/labeler@v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true
